name: Report an error or missing credit
description: Tell Wakka about an incorrect detail, missing credit, or broken link.
title: "[Archive report] "
body:
  - type: input
    id: record
    attributes:
      label: Title or record
      description: Include the catalog URL, record ID, or exact title.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What looks incorrect?
      description: Describe the incorrect detail, missing credit, or broken link. Wakka reviews reports and makes any site updates.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Supporting reference
      description: Include a source link where possible. Please provide filenames or checksums rather than attaching game files.
